services:
  - type: web
    name: spice-haven-backend
    runtime: openjdk
    rootDir: backend/restont
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/restont-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: spicehaven
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: spicehaven
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: spicehaven
          property: password
      - key: DB_URL
        fromDatabase:
          name: spicehaven
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: spicehaven
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: spicehaven
          property: password
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JPA_DDL_AUTO
        value: update

databases:
  - name: spicehaven
    plan: free
