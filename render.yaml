services:
  - type: web
    name: spice-haven-backend
    runtime: openjdk
    rootDir: backend/restont
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/restont-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JPA_DDL_AUTO
        value: update
