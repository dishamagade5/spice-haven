
services:
  - type: web
    name: spice-haven-backend
    runtime: docker
    rootDir: backend/restont
    dockerfilePath: ./Dockerfile
    dockerContext: ./ 
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JPA_DDL_AUTO
        value: update
