spring.application.name=restont
server.port=${PORT:8085}
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/restont/.env[.properties],optional:file:./restont/.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/defaultdb?sslmode=require
spring.datasource.username=${AIVEN_USERNAME}
spring.datasource.password=${AIVEN_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Cache
spring.cache.type=caffeine

# Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS
spicehaven.cors.allowed-origin=${SPICEHAVEN_CORS_ALLOWED_ORIGINS:http://localhost:5173}
spicehaven.menu.image-directory=${SPICEHAVEN_MENU_IMAGE_DIRECTORY:uploads/dishes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Admin
spicehaven.admin.email=${SPICEHAVEN_ADMIN_EMAIL:admin@gmail.com}
spicehaven.admin.password=${SPICEHAVEN_ADMIN_PASSWORD:admin}

# JWT
spicehaven.jwt.secret=${SPICEHAVEN_JWT_SECRET:}
spicehaven.jwt.expiry-minutes=${SPICEHAVEN_JWT_EXPIRY_MINUTES:120}

# WhatsApp
spicehaven.whatsapp.number=${SPICEHAVEN_WHATSAPP_NUMBER:}

# Razorpay (server-side secret; never expose the secret to the frontend)
razorpay.key-id=${RAZORPAY_KEY_ID:${RAZORPAY_API_KEY:${razorpay.api.key:rzp_test_TkTPd5w7n0Iyvz}}}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_API_SECRET:${razorpay.api.secret:AejZH5HVV0QivgJMSsxAu01E}}}

# Error
server.error.include-message=always
server.error.include-binding-errors=always
