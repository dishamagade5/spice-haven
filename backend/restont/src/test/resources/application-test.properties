spring.datasource.url=jdbc:h2:mem:spicehaven;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spicehaven.cors.allowed-origin=https://spicehaven-test.example
spicehaven.menu.image-directory=target/test-menu-images
spicehaven.admin.email=admin@example.com
spicehaven.admin.password=test-admin-password
spicehaven.jwt.expiry-minutes=120
spicehaven.whatsapp.number=
